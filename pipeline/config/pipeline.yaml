grupo_ti:
  nome: "Tecnologia da Informação"

setores:
  # Grupo GLPI + categoria de User que definem um "setor" (descobertos por
  # nome, nunca por id - o id pode mudar). `categorias_extra`: contas de
  # departamento que contam como setor mas ficam FORA do grupo "Setores"
  # (ex. supervisores de manutenção TI/ME/MP - categoria "Supervisor",
  # entities_id na raiz). Elas recebem `unidade_extra` fixa porque são
  # transversais (o ti-supervisor cobre HGVC e UPA).
  grupo: "Setores"
  categoria: "Setor"
  categorias_extra:
    - "Supervisor"
  unidade_extra: "geral"

categorias_ti:
  raiz: "Tecnologia da Informação"

granularidades:
  - diaria
  - semanal
  - mensal
# Cada granularidade acima cruza com cumulativo=true/false (build_snapshots em
# analytics/snapshot.py) - diaria+cumulativo=true tambem serve como visao
# "acumulado geral". Chave nao lida por codigo, so documentacao.

status:
  # Vocabulario GLPI padrao (id -> rotulo pt-BR), so pra exibicao/logs.
  1: novo
  2: processando_atribuido
  3: processando_planejado
  4: pendente
  5: solucionado
  6: fechado

solved_threshold: 5   # status >= isso conta como "terminado" (fechado e raro nesta base)
