name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancela execucoes antigas do mesmo ref quando chega um push novo.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    env:
      # Testes nao tocam GLPI/Postgres de verdade - sqlite evita depender de
      # servico externo no runner (ver docs/requisitos.md, secao CI/CD).
      DATABASE_URL: "sqlite:///./ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar pacote (api + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Rodar testes
        run: pytest -q

  frontend:
    name: Frontend · typecheck + test + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck (bloqueante)
        run: npx tsc --noEmit
      - name: Testes (bloqueante)
        run: npm test
      - name: Lint (informativo, nao bloqueia)
        # Debito de lint pre-existente - reporta sem quebrar o CI.
        run: npm run lint
        continue-on-error: true

  build-and-push:
    name: Build & Push images
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ti-helpdesk-analytics-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ti-helpdesk-analytics-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PROD_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy · VM hospital
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Atualizar stack em producao
        # /opt/ti-helpdesk-analytics e um checkout fixo, feito manualmente uma
        # vez na VM (ver docs de setup do runner). O .env de producao mora la
        # fora do git - `git reset --hard` nunca apaga arquivo nao versionado.
        run: |
          set -e
          cd /opt/ti-helpdesk-analytics
          git fetch origin master
          git reset --hard origin/master
          docker compose -f docker-compose.vm.yml pull
          docker compose -f docker-compose.vm.yml up -d
          docker image prune -f
